dump_devices:
  name: Dump devices
  fields:
    addresses:
      required: false
      example: "EE:E8:37:9F:6B:54 C7:B8:C6:B0:27:11 AA:AA:AA:AA:AA:AA"
      default: ""
    configured_devices:
      required: false
      example: "False"
      default: true
    redact:
      required: false
      example: "False"
      default: false
# TAW-V fingerprint
record_fingerprint:
  fields:
    area_id:
      required: false
      example: "living_room"
      selector:
        area:
    room:
      required: false
      example: "Attic stairs"
      selector:
        text:
    label:
      required: false
      example: "Sofa"
      selector:
        text:
    spot_id:
      required: false
      example: "0123456789ab"
      selector:
        text:
    device:
      required: false
      example: "aabbccddeeff00112233445566778899_1_2"
      selector:
        text:
    duration:
      required: false
      default: 120
      selector:
        number:
          min: 30
          max: 600
          step: 10
          unit_of_measurement: s
    carry:
      required: false
      selector:
        select:
          options:
            - hand
            - pocket
            - table
            - other
    replace:
      required: false
      default: false
      selector:
        boolean:
cancel_fingerprint:
delete_fingerprint:
  fields:
    spot_id:
      required: false
      selector:
        text:
    area_id:
      required: false
      selector:
        area:
    room:
      required: false
      selector:
        text:
    label:
      required: false
      selector:
        text:
clear_fingerprints:
  fields:
    area_id:
      required: false
      selector:
        area:
    room:
      required: false
      selector:
        text:
list_fingerprints:
evaluate_fingerprints:
  fields:
    method:
      required: false
      selector:
        select:
          options:
            - knn
            - bayes
    offset_max:
      required: false
      selector:
        number:
          min: 0
          max: 10
          step: 0.5
          unit_of_measurement: dB
          mode: box
    outlier_db:
      required: false
      selector:
        number:
          min: 0
          max: 40
          step: 0.5
          unit_of_measurement: dB
          mode: box
    use_offset:
      required: false
      selector:
        boolean:
    temperature:
      required: false
      selector:
        number:
          min: 0.05
          max: 20
          step: 0.05
          mode: box
    details:
      required: false
      default: false
      selector:
        boolean:
map_room:
  fields:
    room:
      required: true
      selector:
        text:
    area_id:
      required: true
      selector:
        area:
